<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Hanumate Team Portal</title>
<!-- g10: new dashboard look + calendar. g9: login page matched to the new mockup (no logo). g8: new login page. g7: leave requests, task details, dashboard, attendance, search, charts. Needs hanumate_portal_v7.sql -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--sf:#fffdf8;--ink:#1b1612;--mut:#6d6358;--line:#e2d9c8;--acc:#d9480f;--acc2:#f2a33a;--ok:#2f7d4f;--r:14px;
--d:'Fraunces',Georgia,serif;--b:'Instrument Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110e;--sf:#1d1914;--ink:#f3ece0;--mut:#a39787;--line:#302a22;--acc:#ff7a3d;--ok:#5fc08a}}
:root[data-theme="dark"]{--bg:#14110e;--sf:#1d1914;--ink:#f3ece0;--mut:#a39787;--line:#302a22;--acc:#ff7a3d;--ok:#5fc08a}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--b);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.mut{color:var(--mut)}.eyebrow{font:600 12px/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1,h2,h3{font-family:var(--d);font-weight:400;line-height:1.02;letter-spacing:-.02em;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;cursor:pointer;font-weight:500;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s}
.btn:hover{transform:translateY(-2px);background:var(--acc);border-color:var(--acc);color:#fff}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{padding:7px 14px;font-size:14px}
nav.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font:600 20px var(--d);text-decoration:none;display:flex;gap:10px;align-items:center}
.sun{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--acc2),var(--acc))}
nav.top .links{display:flex;gap:6px;align-items:center}nav.top a.l{padding:8px 12px;text-decoration:none;color:var(--mut);border-radius:99px}nav.top a.l:hover{color:var(--ink)}
.hero{position:relative;padding:clamp(48px,10vw,120px) 0 clamp(40px,8vw,90px);overflow:hidden}
.hero h1{font-size:clamp(46px,10.5vw,138px);margin:22px 0 28px}.hero h1 em{color:var(--acc);font-style:italic}
.hero .orb{position:absolute;right:-6vw;top:8vw;width:clamp(180px,34vw,440px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc2),var(--acc) 60%,transparent 72%);opacity:.9;filter:blur(2px);animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both;z-index:-1}
.hero p{max-width:46ch;font-size:19px}
.sec{padding:clamp(48px,8vw,96px) 0;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(34px,5.5vw,64px);margin:14px 0 36px}
.row{display:grid;grid-template-columns:70px 1fr;gap:18px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line);transition:padding .35s cubic-bezier(.2,.8,.2,1)}
.row:hover{padding-left:12px}.row .n{font:400 14px var(--d);color:var(--mut)}.row .nm{font:400 clamp(24px,3.4vw,38px) var(--d);letter-spacing:-.01em}
.row .tag{font-size:14px;color:var(--mut);text-align:right}
details{border-bottom:1px solid var(--line);padding:20px 0}summary{cursor:pointer;display:flex;justify-content:space-between;gap:16px;list-style:none;font:400 clamp(22px,3vw,32px) var(--d)}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--acc);transition:transform .3s}details[open] summary::after{transform:rotate(45deg)}
details .body{padding:14px 0 6px;max-width:60ch;color:var(--mut)}details .body .btn{margin-top:14px}
footer{padding:40px 0;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
/* portal */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside .logo{margin-bottom:22px}
.tab{display:flex;gap:10px;align-items:center;padding:10px 14px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer;color:var(--mut);transition:background .2s,color .2s}
.tab:hover{background:var(--line);color:var(--ink)}.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{padding:clamp(20px,4vw,48px);min-width:0}main h1{font-size:clamp(34px,5vw,58px);margin:8px 0 6px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:28px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.big{font:400 44px/1 var(--d);margin:10px 0 4px}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.col h3{font:600 13px var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.task{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;animation:rise .5s both}
.task small{color:var(--mut)}.task .acts{display:flex;gap:6px;margin-top:10px}
.ic{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 10px;cursor:pointer}.ic:hover{border-color:var(--acc);color:var(--acc)}
form.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-top:14px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
.pill.ai{background:linear-gradient(135deg,#fda660,#f26a1c);color:#fff;font-weight:600;letter-spacing:.04em;padding:2px 9px}
.tpg{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}.tpg i{width:6px;height:6px;border-radius:50%;background:var(--mut,#8a8a8a);opacity:.35;animation:tpg 1.1s ease-in-out infinite}.tpg i:nth-child(2){animation-delay:.15s}.tpg i:nth-child(3){animation-delay:.3s}
@keyframes tpg{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.tpg i{animation:none;opacity:.6}}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--line)}.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}.who{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.av{overflow:hidden;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font:600 15px var(--b);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:440px;width:100%;padding:32px}
.note{font-size:13px;color:var(--mut);margin-top:12px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:820px){.kan{grid-template-columns:1fr}.row{grid-template-columns:36px 1fr}.row .tag{grid-column:2;text-align:left}.hero .orb{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{display:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
dialog{background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:92vw;max-height:92vh;max-height:92dvh}dialog::backdrop{background:rgba(0,0,0,.45)}
.av[data-view]{cursor:zoom-in;transition:transform .2s}.av[data-view]:hover{transform:scale(1.06)}
dialog.lbx{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(12,9,6,.94);color:#fff}
dialog.lbx[open]{display:grid;place-items:center}dialog.lbx::backdrop{background:transparent}
.lbx .lbh{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;font:500 18px var(--b)}
.lbx .lbc{background:none;border:0;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:10px 14px;border-radius:99px}.lbx .lbc:hover{background:rgba(255,255,255,.16)}
.lbx img{width:min(88vw,76vh);height:min(88vw,76vh);object-fit:contain;border-radius:12px;animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#crv:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.bdg{background:var(--acc);color:#fff;border-radius:99px;font:600 11px/1 var(--b);padding:4px 7px;margin-left:8px}.bdg[hidden]{display:none}
.chat{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - 2*clamp(20px,4vw,48px));min-height:420px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sf)}
.cl{border-right:1px solid var(--line);overflow-y:auto}
.cr{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}.cr:hover,.cr.on{background:var(--bg)}
.ci{flex:1;min-width:0;display:grid;gap:2px}.cn,.cp{display:flex;justify-content:space-between;align-items:center;gap:8px}.cn small{color:var(--mut);font-size:12px}.cp>span:first-child{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{display:flex;flex-direction:column;min-width:0;min-height:0}
.chd{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.cback{display:none}
.cm{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.mrow{display:flex}.mrow.me{justify-content:flex-end}
.bub{max-width:min(75%,520px);background:var(--sf);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px}
.mrow.me .bub{background:color-mix(in srgb,var(--acc) 16%,var(--sf));border-color:color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:14px 14px 4px 14px}
.bt{white-space:pre-wrap;overflow-wrap:anywhere;display:block}.mm{display:block;text-align:right;font-size:11px;color:var(--mut);margin-top:2px}.seen{color:#3b9ae1}
.mdel{border:0;background:none;color:var(--mut);font-size:11px;cursor:pointer;text-decoration:underline;padding:0 0 0 6px}
.cwho{display:block;font-weight:600;color:var(--acc);font-size:12px}
.cday{text-align:center;margin:8px 0}.cday span{background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:12px;color:var(--mut)}
.cf{display:flex;gap:10px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}.cf textarea{resize:none;max-height:120px;border-radius:18px}
.cempty,.cnone{margin:auto;text-align:center}
@media(max-width:820px){.chat{grid-template-columns:1fr;height:calc(100dvh - 170px)}.chat.open .cl,.chat:not(.open) .ct{display:none}.cback{display:inline-block}}
.pbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}.pbar i{display:block;height:100%}.pbar .d{background:var(--ok)}.pbar .p{background:var(--acc)}
.pcard p{margin:10px 0 0;font-size:14px}.sh{font:600 12px var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 0}
.pg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.sh2{font:600 13px var(--b);color:var(--ink);margin:12px 0 4px}.fl{list-style:none;margin:0;padding:0}.fi{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.callov{position:fixed;inset:0;z-index:60;background:#0e0b08;color:#fff;display:grid;place-items:center}
.callov .cinfo{position:relative;z-index:1;text-align:center;display:grid;gap:10px;justify-items:center}.callov.vid .cinfo{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:0;right:0;text-shadow:0 1px 8px #000}
.callov h2{font:400 34px var(--d);color:#fff}
.callov #lv{position:absolute;right:16px;bottom:120px;width:min(28vw,140px);aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.7);background:#000;display:none;z-index:2;transform:scaleX(-1)}.callov.lvon #lv{display:block}
.callov .cbtns{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:18px;z-index:3}
.cb{width:62px;height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;cursor:pointer;transition:transform .2s}.cb:hover{transform:scale(1.07)}.cb[aria-pressed=true]{background:#fff;color:#111}
.cb.end{background:#e5383b}.cb.end span{display:inline-block;transform:rotate(135deg)}.cb.acc{background:#2fb344}


/* ===== Group calls ===== */
.callov .chead{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;z-index:3;display:grid;gap:2px;justify-items:center;text-align:center;pointer-events:none;text-shadow:0 1px 8px #000}
.callov .chead h2{font-size:clamp(22px,4vw,30px)}.callov .chead p{margin:0;opacity:.85;font-size:14px;font-variant-numeric:tabular-nums}
.ctiles{position:absolute;inset:0}
.ctiles.grp{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);padding:calc(72px + env(safe-area-inset-top,0px)) 8px calc(116px + env(safe-area-inset-bottom,0px))}
@media(min-aspect-ratio:1/1){.ctiles.grp.big{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ctiles.grp .tile:last-child:nth-child(odd){grid-column:1/-1}
@media(min-aspect-ratio:1/1){.ctiles.grp.big .tile:last-child:nth-child(odd){grid-column:auto}}
.tile{position:relative;overflow:hidden;display:grid;place-items:center;min-height:0;background:#1b1612;border-radius:16px;transition:box-shadow .2s}
.ctiles.duo .tile{position:absolute;inset:0;border-radius:0}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity .25s}
.tile.vid video{opacity:1}.tile.self video{transform:scaleX(-1)}
.tile .tav{position:relative;z-index:1}.tile.vid .tav{display:none}.tile.wait .tav{opacity:.55}
.grp .tav .av{width:min(76px,38%)!important;height:auto!important;aspect-ratio:1;font-size:22px!important}
.tile .tnm{position:absolute;left:10px;right:10px;bottom:8px;z-index:2;display:flex;gap:8px;align-items:baseline;font-size:13px;text-shadow:0 1px 6px #000}.tnm small{opacity:.85}
.ctiles.duo .tnm{display:none}
.grp .tile.spk{box-shadow:inset 0 0 0 3px var(--acc2)}
.callov #cadd svg{display:block;margin:auto}
.cnewc{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-weight:600;color:var(--acc)}.cnewc:hover{background:var(--bg)}
.cnewc .gi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);flex:none}
.gk{border:0;padding:0;margin:0;display:flex;gap:10px}.gk label{display:flex;flex-direction:row;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);border-radius:99px;color:var(--ink);font-size:15px;cursor:pointer}.gk input{width:18px;height:18px;min-height:0!important;padding:0;accent-color:var(--acc)}
.gl{display:grid;max-height:min(46vh,360px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px}
.gr{display:flex;flex-direction:row;align-items:center;gap:12px;padding:8px 8px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:15px}.gr:hover{background:var(--bg)}
.gr input{width:20px;height:20px;padding:0;flex:none;accent-color:var(--acc)}.gr span:not(.av){display:grid;line-height:1.25}.gr small{color:var(--mut);font-size:12px}
.toast{z-index:80}body:has(#callov) .toast{bottom:auto;top:calc(84px + env(safe-area-inset-top,0px))}
@media(prefers-reduced-motion:reduce){.tile,.tile video{transition:none}}

/* ===== Responsive pass: phones, tablets, laptops, large screens ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.grid.gl{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.t8{min-width:1080px}.t6{min-width:760px}table.rt td select{min-width:140px}
@media(min-width:1025px){aside{overflow-y:auto}}body{overflow-x:clip}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
main{width:100%;max-width:1320px;margin-inline:auto}
.who{flex-wrap:wrap;row-gap:8px}
.tb{grid-template-columns:minmax(180px,1fr) 190px auto}
.kan{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tab{position:relative}.ti{width:22px;text-align:center;flex:none}
aside{scrollbar-width:none}aside::-webkit-scrollbar{display:none}
@supports(height:100dvh){.shell{min-height:100dvh}.login{min-height:100dvh}}
@media(min-width:1025px){@supports(height:100dvh){aside{height:100dvh}}}
.chat{height:calc(var(--vvh,100dvh) - 2*clamp(20px,4vw,48px))}
@media(min-width:1700px){body{font-size:17px}main{max-width:1440px}}
@media(max-width:820px){
 .chat{height:calc(var(--vvh,100dvh) - 56px - env(safe-area-inset-top,0px) - 2*clamp(20px,4vw,48px))}.bub{max-width:86%}
 body.inthread .topbar,body.inthread .scrim{display:none}
 body.inthread main{padding:0}
 body.inthread .chat{height:calc(var(--vvh,100dvh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;border-radius:0}
 .login .card{padding:24px 20px}
}
@media(max-width:560px){
 form.f:not(.tb){grid-template-columns:minmax(0,1fr)}form.f label[style*="span 2"]{grid-column:auto!important}
 .tb{grid-template-columns:1fr 1fr}.tb button{grid-column:1/-1}
 .grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.grid.gl{grid-template-columns:minmax(0,1fr)}.wide{grid-column:1/-1}
 .card{padding:16px}.big{font-size:32px}
 h1{letter-spacing:-.015em}
}
@media(max-width:700px){
 .scroll{overflow:visible}.t8,.t6{min-width:0}table.rt td select{min-width:0}
 table.rt,table.rt tbody{display:block}table.rt tr:first-child{display:none}
 table.rt tr{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:var(--sf)}
 table.rt td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:5px 0;text-align:right;overflow-wrap:anywhere}
 table.rt td::before{content:attr(data-label);color:var(--mut);text-align:left;flex:none;font-size:13px}
 table.rt td[colspan]{display:block;text-align:left}table.rt td[colspan]::before{content:none}
 table.rt td select{width:auto;max-width:60%}
}

/* ===== Hamburger drawer: phones and tablets (<= 1024px) ===== */

dialog.srch{width:min(640px,94vw);max-width:none;margin:10vh auto auto;padding:0;overflow:hidden;border-radius:18px}dialog.srch::backdrop{background:rgba(10,8,6,.5)}
.sq{display:flex;align-items:center;gap:12px;padding:4px 18px;border-bottom:1px solid var(--line);color:var(--mut)}.sq input{border:0;background:none;padding:14px 0;font-size:18px;min-height:0;color:var(--ink)}.sq input:focus{outline:none}
.sq kbd,.srchbtn kbd{font:500 12px var(--b);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--mut)}
.sl{max-height:min(56vh,460px);overflow-y:auto;padding:6px 0;overscroll-behavior:contain}
.sg{font:600 13px var(--b);color:var(--mut);padding:12px 18px 4px}
.so{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 18px;cursor:pointer;color:inherit}
.so[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.so .ic0{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;background:var(--bg)}
.so b{font-weight:500;display:block;overflow-wrap:anywhere}.so small{color:var(--mut);display:block;overflow-wrap:anywhere}
.sf2{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.srchbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;margin:-8px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--mut);cursor:pointer;text-align:left;transition:border-color .2s,color .2s}.srchbtn:hover{border-color:var(--acc);color:var(--ink)}.srchbtn kbd{margin-left:auto}
.sbt{position:relative;width:44px;height:44px;flex:none;border:0;border-radius:12px;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center}.sbt:hover{background:var(--line)}
@media(max-width:1024px){.srchbtn{display:none}}@media(min-width:1025px){.sbt{display:none}}
@media(pointer:coarse){.srchbtn kbd,.sf2,.sq kbd{display:none}}
@media(max-width:560px){.fun .r{grid-template-columns:88px minmax(0,1fr) 30px}dialog.srch{margin-top:calc(8px + env(safe-area-inset-top,0px))}}
@media(prefers-reduced-motion:reduce){.att-i,.seg button,.srchbtn{transition:none}}
/* ===== v9: login page (matches Warm_SaaS_Workspace_Login mockup) ===== */
.lg{--lo:#f07a1c;--ln:#1c2330;--lg:#6f747d;color-scheme:light;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#fef7ef;color:var(--ln);font:400 16px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@supports(height:100dvh){.lg{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
.lg *{box-sizing:border-box}.lg h1,.lg h2,.lg p{margin:0;font-family:inherit}
.lg-l{position:relative;overflow:hidden;min-height:max(640px,44vw);background:#fbe6d2}
.lg-ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left bottom;user-select:none;pointer-events:none}
.lg-hero{position:relative;z-index:2;padding:clamp(76px,18vh,190px) clamp(28px,6.4vw,118px) 0}
.lg-hero h1{font-weight:400;font-size:clamp(38px,min(3.7vw,7.4vh),78px);line-height:1.1;letter-spacing:-.025em;color:#262b36}
.lg-hero h1 em{display:block;font-style:normal;font-weight:700;background:linear-gradient(95deg,#e0580c,#e8650f 55%,#ea6d14);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.lg-sub{margin-top:clamp(16px,2.6vh,26px);max-width:21em;font-size:clamp(17px,1.22vw,23px);line-height:1.55;color:#454b57}
.lg-ft{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0;margin:clamp(22px,4.2vh,40px) 0 0;padding:0;list-style:none;color:#454b57;font-size:clamp(15px,1vw,18px)}
.lg-ft li{display:inline-flex;align-items:center;gap:10px;padding:0 clamp(14px,1.5vw,26px)}.lg-ft li:first-child{padding-left:0}
.lg-ft li+li{border-left:1px solid rgba(232,101,15,.28)}.lg-ft svg{color:#e8650f;flex:none}
.lg-r{position:relative;overflow:hidden;display:grid;place-items:center;padding:clamp(32px,5vh,64px) clamp(20px,3vw,56px);background:linear-gradient(165deg,#fef9f3,#fef5ec 55%,#fdf0e3)}
.lg-b3{position:absolute;left:80%;bottom:-48%;width:88%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 28% 22%,#fed9b6,#fdc48f 58%,#fbac6c)}
.lg-b5{position:absolute;left:58%;bottom:-24%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 30%,rgba(253,236,218,.95),rgba(252,226,200,.7));opacity:.8}
.lg-b4{position:absolute;left:87.5%;top:47%;width:84.5%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(246,160,100,.42)}
.lg-leaf{position:absolute;right:0;bottom:0;width:clamp(70px,7.2vw,124px);height:auto;pointer-events:none;user-select:none}
.lg-c{position:relative;z-index:2;width:min(586px,100%);padding:clamp(28px,2.6vw,46px);border-radius:28px;background:rgba(254,250,246,.96);box-shadow:0 30px 80px -26px rgba(214,128,60,.34),0 2px 14px rgba(214,128,60,.08)}
.lg-rule{display:block;width:59px;height:4px;border-radius:4px;background:#f27a2a;margin-bottom:clamp(18px,3vh,28px)}
.lg-c h2{font-weight:800;font-size:clamp(29px,2.45vw,44px);line-height:1.1;letter-spacing:-.025em;color:var(--ln)}
.lg-c .lg-lead{margin-top:10px;font-size:clamp(16px,1.12vw,20px);color:var(--lg)}
.lg-f{margin-top:clamp(20px,3.6vh,34px);display:flex;flex-direction:column}
.lg-f label{font-size:15.5px;font-weight:500;color:#2b303b;display:block;margin-bottom:9px}.lg-f .lg-fd+.lg-fd{margin-top:clamp(18px,3.2vh,28px)}
.lg-fi{position:relative;display:block}
.lg-fi>svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);color:#8b7f78;pointer-events:none}
.lg-fi input{display:block;width:100%;height:56px;padding:0 56px 0 66px;border:1px solid #e9e0d7;border-radius:14px;background:#fffdfb;font-family:inherit;font-size:16px;font-weight:400;line-height:1;color:#363b47;transition:border-color .2s,box-shadow .2s,background .2s}
.lg-fi input::placeholder{color:#8a8f98}
.lg-fi input:hover{border-color:#dfd1c3}.lg-fi input:focus{outline:none;border-color:var(--lo);background:#fff;box-shadow:0 0 0 4px rgba(240,122,28,.16)}
.lg-eye{all:unset;position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;border-radius:10px;cursor:pointer;color:#8b7f78}.lg-eye:hover{color:#c2530f;background:rgba(240,122,28,.08)}
.lg-er{font-size:14.5px;line-height:1.45;color:#b4470a;font-weight:500}.lg-er:not(:empty){margin-top:16px}
.lg-go{all:unset;box-sizing:border-box;margin-top:clamp(24px,4vh,34px);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:60px;border-radius:12px;cursor:pointer;color:#fff;font:700 18.7px/1 'Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(95deg,#f27c1b,#e95a10);box-shadow:0 16px 28px -14px rgba(233,90,16,.6);transition:transform .2s,filter .2s,box-shadow .2s}
.lg-go:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 20px 32px -14px rgba(233,90,16,.65)}.lg-go:active{transform:none}
.lg-go:focus-visible,.lg-eye:focus-visible{outline:3px solid rgba(240,122,28,.55);outline-offset:3px}
.lg-go[disabled]{opacity:.72;cursor:progress;transform:none;filter:none}
.lg-sec{display:flex;align-items:center;gap:14px;margin-top:clamp(20px,3.4vh,32px);color:#80858e;font-size:14.5px}.lg-sec::before,.lg-sec::after{content:"";flex:1;height:1px;background:#eee6de}.lg-sec span{display:inline-flex;align-items:center;gap:8px}
@media(max-width:900px){
 .lg{grid-template-columns:minmax(0,1fr)}.lg-l{min-height:0}.lg-l::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(254,247,238,.94),rgba(254,247,238,.62))}
 .lg-ph{object-position:left bottom}.lg-sub,.lg-ft{display:none}.lg-hero{padding:46px 26px 40px}.lg-hero h1{font-size:clamp(32px,9vw,48px)}
 .lg-r{padding:20px 16px 44px}.lg-b3{left:55%;width:100%;bottom:-40%}.lg-b4,.lg-b5{display:none}.lg-leaf{width:84px}
}
@media(prefers-reduced-motion:reduce){.lg *{transition:none!important}.lg-go:hover{transform:none}}
/* ===== v10: dashboard skin (peach SaaS) ===== */
:root{--bg:#fcf7f1;--sf:#fffdfb;--ink:#1f2430;--mut:#6b707a;--line:#f0e6dc;--acc:#c24a08;--acc2:#f58a3a;--ok:#1d8556;--o:#f07a1c;--pk:#fdebd9;--r:20px;--d:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--sh:0 12px 34px -18px rgba(205,120,50,.32),0 1px 3px rgba(205,120,50,.07);--bd:rgba(238,212,188,.55);--tr:#f3e9df}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--sf:#201914;--ink:#f4ece2;--mut:#a99d90;--line:#33291f;--acc:#ff8a4c;--ok:#5fc08a;--pk:#3b2518;--sh:0 12px 34px -18px rgba(0,0,0,.6);--bd:rgba(255,255,255,.07);--tr:#2e251d}}
:root[data-theme="dark"]{--bg:#15110e;--sf:#201914;--ink:#f4ece2;--mut:#a99d90;--line:#33291f;--acc:#ff8a4c;--ok:#5fc08a;--pk:#3b2518;--sh:0 12px 34px -18px rgba(0,0,0,.6);--bd:rgba(255,255,255,.07);--tr:#2e251d}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;line-height:1.15}
.btn{background:linear-gradient(95deg,#d9560b,#c24a08);border-color:transparent;color:#fff;font-weight:600;transition:transform .2s,filter .2s}
.btn:hover{background:linear-gradient(95deg,#e0600f,#cb500a);border-color:transparent;color:#fff;filter:brightness(1.04)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--pk);border-color:var(--bd);color:var(--ink)}
input,select,textarea{background:var(--sf);border-radius:12px}
.card,.task{border-color:var(--bd);box-shadow:var(--sh);border-radius:var(--r)}.task{border-radius:16px;box-shadow:none}
.big{font:700 36px/1 var(--d);letter-spacing:-.02em}
.eyebrow{font:500 13.5px/1.3 var(--b);letter-spacing:0;text-transform:none;color:var(--mut)}
main h1{font-size:clamp(26px,2.2vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:6px 0 6px}
main h2{font-weight:700}
.sh,.col h3{letter-spacing:.06em}
.chat{border-color:var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.so .ic0 svg{width:17px;height:17px}

.ds:hover{transform:translateY(-2px)}.ds>span{display:block}

.d2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:26px}

.dph h2{font-size:18px;font-weight:700;margin:0}.va{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--mut);font-size:13px;cursor:pointer;padding:6px 4px;border-radius:8px}.va:hover{color:var(--acc)}

.pc{text-align:right;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.dl2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:15px 0;cursor:pointer;color:inherit}.dl2:first-of-type{border-top:0}.dl2:hover .di b{color:var(--acc)}
.di{flex:1;min-width:0;display:grid;line-height:1.35}.di b{font-weight:500;font-size:15px;overflow-wrap:anywhere;transition:color .2s}.di small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.pl{padding:6px 16px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}.pl.h{background:#fde7e7;color:#b72a2a}.pl.m{background:#fcefd2;color:#8f5a06}.pl.l{background:#e2f2e9;color:#18704a}

.dl2>svg{color:var(--mut);flex:none}
.mt-e{display:grid;justify-items:center;gap:4px;text-align:center;padding:10px 0 78px}.mt-e .ok{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--pk);color:var(--o);margin-bottom:6px}.mt-e b{font-size:18px;font-weight:700}.mt-e small{color:var(--mut);font-size:14px}

function cropDialog(file){return new Promise((res,rej)=>{
 const url=URL.createObjectURL(file),img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};
 img.onload=()=>{
  const V=Math.min(280,Math.floor(innerWidth*.72)),w=img.naturalWidth,h=img.naturalHeight,s0=Math.max(V/w,V/h);let z=1,x=0,y=0,done=false;
  const d=document.createElement('dialog');d.id='crd';
  d.innerHTML=`<form id="crf" style="display:grid;gap:14px;justify-items:center;width:min(340px,82vw)"><h3 style="font-size:26px;justify-self:start">Adjust photo</h3>
  <div id="crv" tabindex="0" aria-label="Photo preview. Drag or use arrow keys to reposition." style="position:relative;width:${V}px;height:${V}px;overflow:hidden;border-radius:12px;background:#000;touch-action:none;cursor:grab"><img id="cri" alt="" draggable="false" style="position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none"><div style="position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.85);outline-offset:-2px;pointer-events:none"></div></div>
  <label style="width:100%">Zoom<input id="crz" type="range" min="1" max="4" step="0.01" value="1"></label>
  <p class="note" style="margin:0">Drag to reposition. Use the slider to zoom.</p>
  <div style="display:flex;gap:10px;justify-self:end"><button type="button" class="btn sm ghost" id="crc">Cancel</button><button class="btn sm" type="submit">Save photo</button></div></form>`;
  document.body.appendChild(d);
  const I=d.querySelector('#cri'),box=d.querySelector('#crv'),Z=d.querySelector('#crz');I.src=url;
  const draw=()=>{const mx=Math.max(0,(w*s0*z-V)/2),my=Math.max(0,(h*s0*z-V)/2);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y));
   const s=s0*z;I.style.width=w*s+'px';I.style.height=h*s+'px';I.style.transform=`translate(${V/2+x-w*s/2}px,${V/2+y-h*s/2}px)`};
  const zoom=nz=>{nz=Math.min(4,Math.max(1,nz));x*=nz/z;y*=nz/z;z=nz;Z.value=z;draw()};
  let px=null,py=null;
  box.onpointerdown=e=>{px=e.clientX;py=e.clientY;box.setPointerCapture(e.pointerId);box.style.cursor='grabbing'};
  box.onpointermove=e=>{if(px===null)return;x+=e.clientX-px;y+=e.clientY-py;px=e.clientX;py=e.clientY;draw()};
  box.onpointerup=box.onpointercancel=()=>{px=null;box.style.cursor='grab'};
  box.onwheel=e=>{e.preventDefault();zoom(z-e.deltaY*.002)};
  box.onkeydown=e=>{const k={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(k){e.preventDefault();x+=k[0];y+=k[1];draw()}};
  Z.oninput=()=>zoom(+Z.value);
  d.querySelector('#crc').onclick=()=>d.close();
  d.querySelector('#crf').onsubmit=e=>{e.preventDefault();const OUT=480,k=OUT/V,s=s0*z,c=document.createElement('canvas');c.width=c.height=OUT;
   const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,OUT,OUT);g.drawImage(img,(V/2+x-w*s/2)*k,(V/2+y-h*s/2)*k,w*s*k,h*s*k);
   let q=.85,u=c.toDataURL('image/jpeg',q);while(u.length>140000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}
   done=true;d.close();res(u)};
  d.addEventListener('close',()=>{URL.revokeObjectURL(url);d.remove();if(!done)rej(new Error('cancel'))});
  d.showModal();draw()};
 img.src=url})}

/* ---------- CALENDAR ---------- */
let CAL={m:null,sel:null,f:null};
function calEvents(){const u=me(),E={},add=(d,e)=>{if(!d)return;d=String(d).slice(0,10);(E[d]=E[d]||[]).push(e)};
 const span=(a,b,e)=>{let d=new Date(String(a).slice(0,10)+'T00:00:00');const z=new Date(String(b).slice(0,10)+'T00:00:00');for(let i=0;d<=z&&i<62;i++){add(d.toLocaleDateString('en-CA'),e);d.setDate(d.getDate()+1)}};
 S.tasks.filter(x=>x.s!=='done'&&tdue(x)&&(CAL.f==='all'||x.who===u.id)).forEach(x=>add(tdue(x),{c:'t',t:x.t,sub:'Task · '+nameOf(x.who),go:()=>taskDialog(x.id)}));
 if(u.admin||u.dev)(S.projects||[]).filter(p=>p.status!=='Delivered').forEach(p=>{add(p.deadline,{c:'d',t:p.client,sub:'Project deadline',go:()=>{view='followups';portal();projectDialog(p)}});if(u.admin||p.owner===u.id)add(p.next_follow_up,{c:'f',t:p.client,sub:'Client follow-up',go:()=>{view='followups';portal();projectDialog(p)}})});
 if(u.admin||u.leads)(S.leads||[]).filter(l=>l.owner===u.id&&l.follow_up&&LACT.includes(l.status)).forEach(l=>add(l.follow_up,{c:'f',t:l.name,sub:'Lead follow-up',go:()=>{view='leads';portal();leadDialog(l)}}));
 S.leaves.forEach(l=>span(l.from_date,l.to_date,{c:'l',t:nameOf(l.staff_id),sub:l.type+' leave',go:()=>{TV='leave';view='time';portal()}}));
 (S.x.lreq||[]).filter(r=>r.status==='pending').forEach(r=>span(r.from_date,r.to_date,{c:'w',t:nameOf(r.staff_id),sub:'Leave request · '+r.type,go:()=>{TV='leave';view='time';portal()}}));
 return E}
function calendar(){const u=me(),t=today();if(!CAL.f)CAL.f=u.admin?'all':'mine';if(!CAL.m)CAL.m=t.slice(0,7);
 const [y,mo]=CAL.m.split('-').map(Number),E=calEvents(),first=new Date(y,mo-1,1),lead=(first.getDay()+6)%7,dim=new Date(y,mo,0).getDate(),cells=Math.ceil((lead+dim)/7)*7,CN={t:'Task due',d:'Project deadline',f:'Follow-up',l:'Leave',w:'Leave request'};
 if(!CAL.sel||CAL.sel.slice(0,7)!==CAL.m)CAL.sel=t.slice(0,7)===CAL.m?t:null;
 const dayHtml=i=>{const d=new Date(y,mo-1,1-lead+i),ds=d.toLocaleDateString('en-CA'),ev=E[ds]||[],other=d.getMonth()!==mo-1;
  return`<button type="button" class="cd${other?' o':''}${ds===t?' t':''}" data-cd="${ds}" aria-pressed="${CAL.sel===ds}" aria-label="${esc(d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'}))}, ${ev.length} event${ev.length===1?'':'s'}"><span class="dn">${d.getDate()}</span>${ev.slice(0,3).map(e=>`<span class="ev ec-${e.c}">${esc(e.t)}</span>`).join('')}${ev.length>3?`<span class="more">+${ev.length-3} more</span>`:''}<span class="dots" aria-hidden="true">${ev.slice(0,4).map(e=>`<i class="ec-${e.c}"></i>`).join('')}</span></button>`};

 const cur=today().slice(0,7);
 el.innerHTML=`<div class="wtb" style="margin-top:22px"><div class="mnav"><button type="button" class="ic" id="amp" aria-label="Previous month">←</button><strong id="aml" style="min-width:150px;text-align:center;font:400 22px var(--d)"></strong><button type="button" class="ic" id="amn" aria-label="Next month">→</button></div>${u.admin?`<label class="vh" for="aw">Person</label><select id="aw" style="width:auto"><option value="all">Whole team</option>${S.team.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>`:''}<button type="button" class="btn sm ghost" id="aex" style="margin-left:auto">${SV(IC.dl,16)} Export CSV</button></div><div id="atb" aria-live="polite"><p class="mut" style="margin-top:20px">Loading…</p></div>`;
 const lab=()=>{const [y,m]=TA.m.split('-').map(Number);$('#aml').textContent=new Date(y,m-1,1).toLocaleDateString([],{month:'long',year:'numeric'});$('#amn').disabled=TA.m>=cur};

async function attLoad(){const my=++TA.rq,[y,mo]=TA.m.split('-').map(Number),from=TA.m+'-01',to=TA.m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0');let rows=null;TA.note='';
 if(!S.x.attMiss){try{rows=await call('hm_att_range',{p_from:from,p_to:to})}catch(e){if(e.message==='not_signed_in'){signedOut('Session expired. Please sign in again.');return}if(MISSRX.test(e.message||'')||/hm_att_v/.test(e.message||''))S.x.attMiss=true}}
 if(!rows){rows=S.att.filter(r=>String(r.day).slice(0,7)===TA.m);TA.note='Showing the attendance records already loaded in the portal. '+(me().admin?SQLHINT:'Older history is not available yet.')}
 if(my!==TA.rq||!$('#atb'))return;TA.rows=rows;attPaint()}
function attDays(rows){const g={},now=Date.now(),t=today(),[sh,sm]=WORK.start.split(':').map(Number),st=sh*60+sm;
 rows.forEach(r=>{const day=String(r.day).slice(0,10),k=r.staff_id+'|'+day,x=g[k]||(g[k]={s:r.staff_id,day,ci:null,hrs:0,open:false});
  const ci=new Date(r.check_in).getTime(),co=r.check_out?new Date(r.check_out).getTime():null;if(x.ci===null||ci<x.ci)x.ci=ci;
  if(co)x.hrs+=Math.max(0,(co-ci)/36e5);else{x.open=true;if(day===t)x.hrs+=Math.max(0,(now-ci)/36e5)}});
 return Object.values(g).map(x=>{const c=new Date(x.ci),mins=c.getHours()*60+c.getMinutes();x.late=mins>st+WORK.grace?mins-st:0;x.live=x.open&&x.day===t;x.noOut=x.open&&!x.live;x.short=!x.open&&x.hrs>0&&x.hrs<WORK.minHours;return x}).sort((a,b)=>b.day.localeCompare(a.day)||a.ci-b.ci)}
const attSum=D=>{const w=D.filter(x=>!x.noOut);return{days:D.length,hrs:D.reduce((n,x)=>n+x.hrs,0),avg:w.length?w.reduce((n,x)=>n+x.hrs,0)/w.length:0,late:D.filter(x=>x.late).length,noOut:D.filter(x=>x.noOut).length}};
function attPaint(){const el=$('#atb');if(!el||!TA.rows)return;const u=me(),days=attDays(TA.rows),who=u.admin?TA.who:u.id,note=TA.note?`<p class="note" style="margin:14px 0 0">${esc(TA.note)}</p>`:'';
 const cards=s=>`<div class="grid"><div class="card"><span class="mut">Days present</span><div class="big">${s.days}</div></div><div class="card"><span class="mut">Total hours</span><div class="big">${fmtH(s.hrs)}</div>${s.days?`<p class="mut" style="margin:0;font-size:14px">${fmtH(s.avg)} average a day</p>`:''}</div><div class="card"><span class="mut">Late arrivals</span><div class="big" style="${s.late?'color:var(--acc)':''}">${s.late}</div><p class="mut" style="margin:0;font-size:14px">After ${esc(WORK.start)} + ${WORK.grace} min</p></div><div class="card"><span class="mut">No check-out</span><div class="big" style="${s.noOut?'color:var(--acc)':''}">${s.noOut}</div><p class="mut" style="margin:0;font-size:14px">Signed in, never signed out</p></div></div>`;
 if(u.admin&&who==='all'){const by=S.team.map(m=>({m,s:attSum(days.filter(x=>x.s===m.id))}));
  el.innerHTML=`<div style="margin-top:20px">${cards(attSum(days))}</div>${note}<h2 style="font-size:30px;margin:30px 0 8px">By person</h2><div class="scroll"><table class="rt"><tr><th>Employee</th><th>Days</th><th>Hours</th><th>Avg a day</th><th>Late</th><th>No check-out</th></tr>${by.map(({m,s})=>`<tr><td data-label="Employee"><button type="button" class="lnk" data-pp="${m.id}">${esc(m.name)}</button></td><td data-label="Days">${s.days}</td><td data-label="Hours">${fmtH(s.hrs)}</td><td data-label="Avg a day">${s.days?fmtH(s.avg):'—'}</td><td data-label="Late"${s.late?' style="color:var(--acc);font-weight:600"':''}>${s.late}</td><td data-label="No check-out"${s.noOut?' style="color:var(--acc);font-weight:600"':''}>${s.noOut}</td></tr>`).join('')}</table></div>`;
  el.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{TA.who=b.dataset.pp;$('#aw').value=TA.who;attPaint()});return}
 const mine=days.filter(x=>x.s===who);
 el.innerHTML=`<div style="margin-top:20px">${cards(attSum(mine))}</div>${note}<h2 style="font-size:30px;margin:30px 0 8px">${u.admin?esc(nameOf(who)):'Daily log'}</h2><div class="scroll"><table class="rt"><tr><th>Date</th><th>In</th><th>Out</th><th>Hours</th><th>Notes</th></tr>${mine.map(x=>{const fl=[x.live?'<span class="chip ok">In now</span>':'',x.late?`<span class="chip over">Late ${x.late} min</span>`:'',x.noOut?'<span class="chip today">No check-out</span>':'',x.short?'<span class="chip today">Short day</span>':''].join(' ');
  const out=TA.rows.filter(r=>r.staff_id===who&&String(r.day).slice(0,10)===x.day&&r.check_out).map(r=>new Date(r.check_out).getTime()).sort((a,b)=>b-a)[0];
  return`<tr><td data-label="Date">${esc(dLab(x.day))}</td><td data-label="In">${tm(x.ci)}</td><td data-label="Out">${x.live?'—':out?tm(out):'—'}</td><td data-label="Hours">${x.noOut?'—':fmtH(x.hrs)}</td><td data-label="Notes">${fl.trim()||'<span class="mut">On time</span>'}</td></tr>`}).join('')||'<tr><td colspan="5" class="mut">No attendance recorded this month.</td></tr>'}</table></div>`}
function attExport(){if(!TA.rows)return;const u=me(),days=attDays(TA.rows),who=u.admin?TA.who:u.id,sel=days.filter(x=>who==='all'||x.s===who).sort((a,b)=>nameOf(a.s).localeCompare(nameOf(b.s))||a.day.localeCompare(b.day));
 const cq=v=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const out=r=>{const o=TA.rows.filter(z=>z.staff_id===r.s&&String(z.day).slice(0,10)===r.day&&z.check_out).map(z=>new Date(z.check_out).getTime()).sort((a,b)=>b-a)[0];return o?tm(o):''};
 const csv=[['Employee','Date','Check in','Check out','Hours','Late (min)','Notes']].concat(sel.map(x=>[nameOf(x.s),x.day,tm(x.ci),x.live?'':out(x),x.noOut?'':x.hrs.toFixed(2),x.late||'',[x.live?'In now':'',x.noOut?'No check-out':'',x.short?'Short day':''].filter(Boolean).join('; ')])).map(r=>r.map(cq).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='attendance-'+TA.m+(who==='all'?'':'-'+nameOf(who).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Attendance exported')}

/* ---------- PROGRESS charts ---------- */
function progCharts(){const L=S.leads||[],tot=L.length,cnt=s=>L.filter(l=>l.status===s).length,conv=tot?Math.round((cnt('Interested')+cnt('Completed'))/tot*100):0,sc={Pending:'p',Interested:'i','Not interested':'n','Has website':'w',Completed:'c'};
 const d0=new Date();d0.setHours(0,0,0,0);d0.setDate(d0.getDate()-((d0.getDay()+6)%7));const ws=[];for(let i=7;i>=0;i--){const s=new Date(d0);s.setDate(s.getDate()-7*i);ws.push(s)}
 const inW=(iso,i)=>{if(!iso)return false;const x=new Date(iso).getTime();return x>=ws[i].getTime()&&(i<7?x<ws[i+1].getTime():true)};
 const cr=ws.map((_,i)=>S.tasks.filter(x=>inW(x.c,i)).length),dn=ws.map((_,i)=>S.tasks.filter(x=>x.s==='done'&&inW(x.d,i)).length),mx=Math.max(1,...cr,...dn);
 const P=(S.projects||[]).filter(p=>p.status!=='Delivered'&&p.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,6);
 return`<h2 style="font-size:30px;margin:36px 0 0">Trends</h2><div class="cg">
 <div class="card"><h3>Lead funnel</h3><p class="mut" style="margin:4px 0 0;font-size:14px">${tot} lead${tot===1?'':'s'} · ${conv}% interested or completed</p><div class="fun" role="img" aria-label="Leads by status: ${LST.map(s=>s+' '+cnt(s)).join(', ')}">${LST.map(s=>`<div class="r" style="--cc:var(--c-${sc[s]})"><span>${esc(s)}</span><span class="bar"><i style="width:${tot?cnt(s)/tot*100:0}%"></i></span><span>${cnt(s)}</span></div>`).join('')}</div></div>
 <div class="card"><h3>Tasks per week</h3><p class="mut" style="margin:4px 0 0;font-size:14px">${dn[7]} completed this week · ${dn[6]} last week</p><div class="lgd" style="margin-top:10px"><span><i></i>Completed</span><span><i class="n"></i>Created</span></div><div class="wk" role="img" aria-label="Tasks completed per week, oldest to newest: ${dn.join(', ')}. Created: ${cr.join(', ')}">${ws.map((s,i)=>`<div class="c"><span class="v">${dn[i]}</span><div class="b"><i style="height:${dn[i]/mx*100}%"></i><i class="n" style="height:${cr[i]/mx*100}%"></i></div><small>${esc(s.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))}</small></div>`).join('')}</div></div>
 <div class="card"><h3>Client deadlines</h3><p class="mut" style="margin:4px 0 0;font-size:14px">Active projects, soonest first</p><div class="dl">${P.length?P.map(p=>{const n=dayN(p.deadline),c=n<=3?'var(--c-n)':n<=7?'var(--c-p)':'var(--ok)',w=n<0?100:Math.max(6,Math.round((1-Math.min(n,30)/30)*100));return`<div class="r" style="--cc:${c}"><div class="t"><span>${esc(p.client)}${p.project?` <span class="mut">· ${esc(p.project)}</span>`:''}</span><strong style="color:${c};font-weight:600;white-space:nowrap">${esc(rel(p.deadline))}</strong></div><div class="bar" role="img" aria-label="${esc(p.client)}: ${esc(rel(p.deadline))}"><i style="width:${w}%"></i></div></div>`}).join(''):'<p class="mut" style="margin:0">No deadlines set yet.</p>'}</div></div></div>`}

/* ---------- GLOBAL SEARCH (Ctrl/Cmd+K) ---------- */
const SRCH={d:null,i:0,items:[]};
function srchBind(){const a=$('#srchp'),b=$('#srchb');if(a)a.onclick=()=>srchOpen();if(b)b.onclick=()=>srchOpen()}
function srchClose(){if(SRCH.d){try{SRCH.d.close()}catch(e){}SRCH.d=null}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&String(e.key).toLowerCase()==='k'&&S.user&&!CALL){e.preventDefault();if(SRCH.d)srchClose();else srchOpen()}});
function srchIndex(){const u=me(),o=[],dg=s=>String(s||'').replace(/\D/g,'');
 TABS.filter(([k])=>(k!=='leads'||u.admin||u.leads)&&(k!=='docs'||u.admin)&&(k!=='progress'||u.admin)&&(k!=='followups'||u.admin||u.dev)).concat(u.admin?[['team','Manage team']]:[]).forEach(([k,l])=>o.push({g:'Go to',ic:TI[k],t:l,s:'',h:l.toLowerCase(),go:()=>{view=k;portal()}}));
 o.push({g:'Go to',ic:'➕',t:'Add a task',s:'Work',h:'add new task create',go:()=>{view='work';portal();const i=$('#tt');if(i)i.focus()}});
 if(!u.admin)o.push({g:'Go to',ic:'🌴',t:'Request leave',s:'Time & Leave',h:'request leave vacation holiday sick',go:()=>{TV='leave';view='time';portal()}});
 if(u.admin||u.leads)o.push({g:'Go to',ic:'➕',t:'Add a lead',s:'Leads',h:'add new lead create',go:()=>{view='leads';portal();leadDialog(null)}});
 S.tasks.forEach(x=>o.push({g:'Tasks',ic:'✅',t:x.t,s:[x.p,nameOf(x.who),TSL[x.s]].filter(Boolean).join(' · '),h:(x.t+' '+x.p+' '+nameOf(x.who)).toLowerCase(),go:()=>{WF.f='all';view='work';portal();taskDialog(x.id)}}));
 if(u.admin||u.leads)(S.leads||[]).forEach(l=>o.push({g:'Leads',ic:'🎯',t:l.name,s:[l.business_type,l.phone,l.status].filter(Boolean).join(' · '),h:[l.name,l.business_type,l.email,l.notes].join(' ').toLowerCase(),dg:dg(l.phone),go:()=>{view='leads';portal();leadDialog(l)}}));
 if(u.admin||u.dev)(S.projects||[]).forEach(p=>o.push({g:'Client projects',ic:'🗓️',t:p.client,s:[p.project,p.status].filter(Boolean).join(' · '),h:[p.client,p.project,p.contact,p.email].join(' ').toLowerCase(),dg:dg(p.phone),go:()=>{view='followups';portal();projectDialog(p)}}));
 S.team.forEach(m=>o.push({g:'People',ic:'👤',t:m.name,s:m.role||'',h:(m.name+' '+(m.role||'')+' '+(m.email||'')).toLowerCase(),go:()=>{view='dir';portal();const q=$('#q');if(q){q.value=m.name;q.dispatchEvent(new Event('input'))}}}));
 return o}
function srchOpen(){if(!S.user||SRCH.d)return;const d=document.createElement('dialog');d.className='srch';d.setAttribute('aria-label','Search');SRCH.d=d;SRCH.items=srchIndex();
 d.innerHTML=`<div class="sq">${SV(IC.search,20)}<input id="sqi" type="text" role="combobox" aria-expanded="true" aria-controls="sl" aria-autocomplete="list" aria-label="Search tasks, leads, projects and people" placeholder="Search tasks, leads, projects, people…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div><div class="sl" id="sl" role="listbox" aria-label="Results"></div><div class="sf2"><span>↑ ↓ to move</span><span>Enter to open</span></div>`;
 document.body.appendChild(d);d.addEventListener('close',()=>{d.remove();if(SRCH.d===d)SRCH.d=null});d.addEventListener('click',e=>{if(e.target===d)d.close()});d.showModal();
 const inp=$('#sqi'),list=$('#sl'),GO=['Go to','Tasks','Leads','Client projects','People'];let cur=[];
 const paint=()=>{const q=inp.value.trim().toLowerCase(),tk=q.split(/\s+/).filter(Boolean),qd=q.replace(/\D/g,'');let r;
  if(!tk.length)r=SRCH.items.filter(x=>x.g==='Go to');
  else r=SRCH.items.map(x=>{const hit=tk.every(w=>x.h.includes(w))||(qd.length>=3&&x.dg&&x.dg.includes(qd));if(!hit)return null;const tl=x.t.toLowerCase();return{x,sc:tl.startsWith(q)?0:tl.includes(q)?1:2}}).filter(Boolean).sort((a,b)=>a.sc-b.sc).map(z=>z.x);
  const lim={'Go to':6,Tasks:6,Leads:5,'Client projects':5,People:5},seen={};
  cur=GO.flatMap(g=>r.filter(x=>x.g===g).slice(0,tk.length?lim[g]:40));SRCH.i=Math.min(SRCH.i,Math.max(0,cur.length-1));
  let last='';list.innerHTML=cur.length?cur.map((x,i)=>{const hd=x.g!==last?`<div class="sg" role="presentation">${x.g}</div>`:'';last=x.g;
   return hd+`<button type="button" class="so" role="option" id="so${i}" data-i="${i}" aria-selected="${i===SRCH.i}"><span class="ic0" aria-hidden="true">${x.ic}</span><span style="min-width:0"><b>${esc(x.t)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</span></button>`}).join(''):`<p class="mut" style="padding:22px 18px;margin:0">No matches for “${esc(inp.value.trim())}”.</p>`;
  inp.setAttribute('aria-activedescendant',cur.length?'so'+SRCH.i:'')};
 const mark=()=>{list.querySelectorAll('.so').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.i===SRCH.i)));const s=$('#so'+SRCH.i);if(s)s.scrollIntoView({block:'nearest'});inp.setAttribute('aria-activedescendant','so'+SRCH.i)};
 const pick=i=>{const x=cur[i];if(!x)return;d.close();setTimeout(()=>x.go(),0)};
 inp.oninput=()=>{SRCH.i=0;paint()};
 inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();if(cur.length){SRCH.i=(SRCH.i+1)%cur.length;mark()}}else if(e.key==='ArrowUp'){e.preventDefault();if(cur.length){SRCH.i=(SRCH.i-1+cur.length)%cur.length;mark()}}else if(e.key==='Enter'){e.preventDefault();pick(SRCH.i)}};
 list.onclick=e=>{const b=e.target.closest('.so');if(b)pick(+b.dataset.i)};list.onmousemove=e=>{const b=e.target.closest('.so');if(b&&+b.dataset.i!==SRCH.i){SRCH.i=+b.dataset.i;mark()}};
 paint();inp.focus()}
