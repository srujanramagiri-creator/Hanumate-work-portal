<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanumate Team Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--sf:#fffdf8;--ink:#1b1612;--mut:#6d6358;--line:#e2d9c8;--acc:#d9480f;--acc2:#f2a33a;--ok:#2f7d4f;--r:14px;
--d:'Fraunces',Georgia,serif;--b:'Instrument Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110e;--sf:#1d1914;--ink:#f3ece0;--mut:#a39787;--line:#302a22;--acc:#ff7a3d;--ok:#5fc08a}}
:root[data-theme="dark"]{--bg:#14110e;--sf:#1d1914;--ink:#f3ece0;--mut:#a39787;--line:#302a22;--acc:#ff7a3d;--ok:#5fc08a}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--b);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
.mut{color:var(--mut)}.eyebrow{font:600 12px/1 var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1,h2,h3{font-family:var(--d);font-weight:400;line-height:1.02;letter-spacing:-.02em;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:99px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;cursor:pointer;font-weight:500;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s}
.btn:hover{transform:translateY(-2px);background:var(--acc);border-color:var(--acc);color:#fff}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{padding:7px 14px;font-size:14px}
nav.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font:600 20px var(--d);text-decoration:none;display:flex;gap:10px;align-items:center}
.sun{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--acc2),var(--acc))}
nav.top .links{display:flex;gap:6px;align-items:center}nav.top a.l{padding:8px 12px;text-decoration:none;color:var(--mut);border-radius:99px}nav.top a.l:hover{color:var(--ink)}
.hero{position:relative;padding:clamp(48px,10vw,120px) 0 clamp(40px,8vw,90px);overflow:hidden}
.hero h1{font-size:clamp(46px,10.5vw,138px);margin:22px 0 28px}.hero h1 em{color:var(--acc);font-style:italic}
.hero .orb{position:absolute;right:-6vw;top:8vw;width:clamp(180px,34vw,440px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--acc2),var(--acc) 60%,transparent 72%);opacity:.9;filter:blur(2px);animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both;z-index:-1}
.hero p{max-width:46ch;font-size:19px}
.sec{padding:clamp(48px,8vw,96px) 0;border-top:1px solid var(--line)}
.sec h2{font-size:clamp(34px,5.5vw,64px);margin:14px 0 36px}
.row{display:grid;grid-template-columns:70px 1fr;gap:18px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line);transition:padding .35s cubic-bezier(.2,.8,.2,1)}
.row:hover{padding-left:12px}.row .n{font:400 14px var(--d);color:var(--mut)}.row .nm{font:400 clamp(24px,3.4vw,38px) var(--d);letter-spacing:-.01em}
.row .tag{font-size:14px;color:var(--mut);text-align:right}
details{border-bottom:1px solid var(--line);padding:20px 0}summary{cursor:pointer;display:flex;justify-content:space-between;gap:16px;list-style:none;font:400 clamp(22px,3vw,32px) var(--d)}
summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--acc);transition:transform .3s}details[open] summary::after{transform:rotate(45deg)}
details .body{padding:14px 0 6px;max-width:60ch;color:var(--mut)}details .body .btn{margin-top:14px}
footer{padding:40px 0;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
/* portal */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside .logo{margin-bottom:22px}
.tab{display:flex;gap:10px;align-items:center;padding:10px 14px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer;color:var(--mut);transition:background .2s,color .2s}
.tab:hover{background:var(--line);color:var(--ink)}.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{padding:clamp(20px,4vw,48px);min-width:0}main h1{font-size:clamp(34px,5vw,58px);margin:8px 0 6px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:28px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.big{font:400 44px/1 var(--d);margin:10px 0 4px}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.col h3{font:600 13px var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.task{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;animation:rise .5s both}
.task small{color:var(--mut)}.task .acts{display:flex;gap:6px;margin-top:10px}
.ic{border:1px solid var(--line);background:none;border-radius:8px;padding:3px 10px;cursor:pointer}.ic:hover{border-color:var(--acc);color:var(--acc)}
form.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-top:14px}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--line)}.pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}.who{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.av{overflow:hidden;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font:600 15px var(--b);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:440px;width:100%;padding:32px}
.note{font-size:13px;color:var(--mut);margin-top:12px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border:0;border-top:1px solid var(--line);z-index:9}
aside .logo,aside .me{display:none}.tab{flex:none;padding:10px 12px;font-size:14px}main{padding-bottom:100px}.kan{grid-template-columns:1fr}.row{grid-template-columns:36px 1fr}.row .tag{grid-column:2;text-align:left}.hero .orb{opacity:.45}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{display:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
dialog{background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:92vw}dialog::backdrop{background:rgba(0,0,0,.45)}
.av[data-view]{cursor:zoom-in;transition:transform .2s}.av[data-view]:hover{transform:scale(1.06)}
dialog.lbx{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(12,9,6,.94);color:#fff}
dialog.lbx[open]{display:grid;place-items:center}dialog.lbx::backdrop{background:transparent}
.lbx .lbh{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;font:500 18px var(--b)}
.lbx .lbc{background:none;border:0;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:10px 14px;border-radius:99px}.lbx .lbc:hover{background:rgba(255,255,255,.16)}
.lbx img{width:min(88vw,76vh);height:min(88vw,76vh);object-fit:contain;border-radius:12px;animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#crv:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.bdg{background:var(--acc);color:#fff;border-radius:99px;font:600 11px/1 var(--b);padding:4px 7px;margin-left:8px}.bdg[hidden]{display:none}
.chat{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - 2*clamp(20px,4vw,48px));min-height:420px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sf)}
.cl{border-right:1px solid var(--line);overflow-y:auto}
.cr{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}.cr:hover,.cr.on{background:var(--bg)}
.ci{flex:1;min-width:0;display:grid;gap:2px}.cn,.cp{display:flex;justify-content:space-between;align-items:center;gap:8px}.cn small{color:var(--mut);font-size:12px}.cp>span:first-child{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{display:flex;flex-direction:column;min-width:0;min-height:0}
.chd{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.cback{display:none}
.cm{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.mrow{display:flex}.mrow.me{justify-content:flex-end}
.bub{max-width:min(75%,520px);background:var(--sf);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px}
.mrow.me .bub{background:color-mix(in srgb,var(--acc) 16%,var(--sf));border-color:color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:14px 14px 4px 14px}
.bt{white-space:pre-wrap;overflow-wrap:anywhere;display:block}.mm{display:block;text-align:right;font-size:11px;color:var(--mut);margin-top:2px}.seen{color:#3b9ae1}
.mdel{border:0;background:none;color:var(--mut);font-size:11px;cursor:pointer;text-decoration:underline;padding:0 0 0 6px}
.cwho{display:block;font-weight:600;color:var(--acc);font-size:12px}
.cday{text-align:center;margin:8px 0}.cday span{background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:12px;color:var(--mut)}
.cf{display:flex;gap:10px;align-items:flex-end;padding:12px;border-top:1px solid var(--line)}.cf textarea{resize:none;max-height:120px;border-radius:18px}
.cempty,.cnone{margin:auto;text-align:center}
@media(max-width:820px){.chat{grid-template-columns:1fr;height:calc(100dvh - 170px)}.chat.open .cl,.chat:not(.open) .ct{display:none}.cback{display:inline-block}}
.pbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}.pbar i{display:block;height:100%}.pbar .d{background:var(--ok)}.pbar .p{background:var(--acc)}
.pcard p{margin:10px 0 0;font-size:14px}.sh{font:600 12px var(--b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Public anon key: safe in the browser because every table is protected by Row Level Security (see supabase-setup.sql). NEVER put the service_role key here. */
const SB_URL='https://qnlkajhybcbxkqczvzqr.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFubGthamh5YmNieGtxY3p2enFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQ1NDYsImV4cCI6MjEwNjU5MDU0Nn0.ZecQZ55dDUjX6oAMLn8agBk5bXdcKarSdFlqj8Ue4-g';
const LEAVE={Casual:12,Sick:8,Earned:15};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOK_KEY='hm_tok';let TOK=null;try{TOK=localStorage.getItem(TOK_KEY)}catch(e){}
async function rpc(fn,args={}){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
 const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||'Request failed');return j}
const call=(fn,a)=>rpc(fn,Object.assign({p_token:TOK},a));
const FR={bad_status:'Pick a valid status.',bad_type:'Pick a leave type.',slow_down:'You are sending too fast. Wait a moment.',bad_text:'Message must be 1 to 1000 characters.',bad_peer:'You cannot message that person.',insufficient_balance:'Not enough leave balance.',forbidden:'You do not have permission to do that.',name_taken:'That profile name is already used.',weak_password:'Password must be at least 8 characters.',wrong_password:'Current password is wrong.',bad_name:'Name must be 2 to 60 characters.',bad_dates:'End date must be on or after start date.',cannot_remove_self:'You cannot remove yourself.',bad_image:'That image could not be saved.'};
const friendly=m=>FR[m]||m||'Something went wrong.';
function signedOut(msg){clearInterval(badgeT);clearInterval(chatT);CH={peer:null,msgs:[],sig:null,seen:0,sum:{group:{unread:0},dms:[]}};document.title='Hanumate Team Portal';TOK=null;try{localStorage.removeItem(TOK_KEY)}catch(e){}S={user:null,team:[],tasks:[],att:[],leaves:[],news:[]};login(msg)}
let S={user:null,team:[],tasks:[],att:[],leaves:[],news:[]},view='home';
const me=()=>S.team.find(t=>t.id===S.user),nameOf=id=>S.team.find(t=>t.id===id)?.name||'—';
const ini=n=>(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const av=(t,z,n)=>`<span class="av"${t.avatar&&!n?` data-view="${esc(t.id)}" role="button" tabindex="0" aria-label="View photo of ${esc(t.name)}"`:''}${z?` style="width:${z}px;height:${z}px;font-size:${Math.round(z/3)}px"`:''}>${t.avatar?`<img src="${esc(t.avatar)}" alt="${esc(t.name)}">`:ini(t.name)}</span>`;
const today=()=>new Date().toLocaleDateString('en-CA'),tm=i=>new Date(i).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
let tt;function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3800)}
async function pull(){const d=await call('portal_data');S.user=d.me;
 S.team=d.team.map(x=>({id:x.id,name:x.name,role:x.role,email:x.email,admin:x.is_admin,avatar:x.avatar,leads:x.leads}));S.leads=d.leads||[];
 S.tasks=d.tasks.map(x=>({id:x.id,t:x.title,p:x.project,s:x.status,who:x.assignee,d:x.done_at,c:x.created_at}));S.att=d.attendance;S.leaves=d.leaves;S.news=d.news}
async function act(fn){try{await fn();await pull();portal()}catch(e){if(e.message==='not_signed_in')signedOut('Session expired. Please sign in again.');else toast(friendly(e.message))}}
const shrink=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const n=320,c=document.createElement('canvas');c.width=c.height=n;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,n,n);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.onerror=()=>{URL.revokeObjectURL(u);no()};i.src=u});

function login(msg){
 $('#app').innerHTML=`<div class="login"><div class="card"><a class="logo" href="#" onclick="return false"><span class="sun"></span>Hanumate</a><h1 style="font-size:40px;margin:22px 0 6px">Team sign in</h1>
 <p class="mut">Type your profile name and password to continue.</p><form id="lf" style="display:grid;gap:14px;margin-top:16px" novalidate>
 <label>Profile name<input id="em" type="text" autocomplete="username" autocapitalize="words" spellcheck="false" placeholder="Type your name" required></label>
 <label>Password<span style="position:relative;display:block"><input id="pw" type="password" autocomplete="current-password" required style="padding-right:78px"><button type="button" id="sp" class="ic" aria-pressed="false" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:13px">Show</button></span></label>
 <p class="note" id="er" role="alert" style="color:var(--acc);margin:0;min-height:1.4em">${esc(msg||'')}</p><button class="btn" type="submit" id="go">Enter portal →</button></form></div></div>`;
 $('#sp').onclick=()=>{const i=$('#pw'),h=i.type==='password';i.type=h?'text':'password';$('#sp').textContent=h?'Hide':'Show';$('#sp').setAttribute('aria-pressed',h)};
 $('#lf').onsubmit=async e=>{e.preventDefault();const er=$('#er'),go=$('#go'),nm=$('#em').value.trim(),pw=$('#pw').value;
  if(!nm||!pw){er.textContent='Enter your profile name and password.';return}
  go.disabled=true;er.textContent='';
  try{const t=await rpc('login',{p_name:nm,p_password:pw});
   if(t==='LOCKED'){er.textContent='Too many wrong attempts. Try again in 10 minutes.';go.disabled=false;return}
   if(!t){er.textContent='Incorrect profile name or password.';go.disabled=false;$('#pw').select();return}
   TOK=t;try{localStorage.setItem(TOK_KEY,t)}catch(x){}
   await pull();view='home';portal();startBadge()}
  catch(x){er.textContent=/fetch|network/i.test(x.message)?'Could not reach Supabase. Check your internet connection.':'Sign-in failed: '+x.message;go.disabled=false}};
}
const TABS=[['home','Home'],['work','Work'],['progress','Progress'],['leads','Leads'],['chat','Chat'],['time','Time & Leave'],['docs','Payslips & Docs'],['dir','Directory'],['profile','Profile']];
function portal(){
 clearInterval(chatT);const u=me();if(!u)return login();if((view==='leads'&&!(u.admin||u.leads))||(view==='team'&&!u.admin)||(view==='docs'&&!u.admin)||(view==='progress'&&!u.admin))view='home';
 $('#app').innerHTML=`<div class="shell"><aside><a class="logo" href="#" onclick="return false"><span class="sun"></span>Hanumate</a>${TABS.filter(([k])=>(k!=='leads'||u.admin||u.leads)&&(k!=='docs'||u.admin)&&(k!=='progress'||u.admin)).concat(u.admin?[['team','Team']]:[]).map(([k,l])=>`<button class="tab" data-v="${k}" ${k===view?'aria-current="page"':''}>${k==='time'&&!u.admin?'Attendance':l}${k==='chat'?'<span id="cbadge" class="bdg" hidden></span>':''}</button>`).join('')}
 <div class="me" style="margin-top:auto;font-size:14px"><div style="display:flex;gap:10px;align-items:center">${av(u,32)}<span class="mut">${esc(u.name)}</span></div><button class="ic" id="out" style="margin-top:8px">Sign out</button></div></aside><main id="m"></main></div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;portal()});
 $('#out').onclick=async()=>{let m='';try{await call('logout');m='Checked out at '+tm(new Date().toISOString())+'. See you soon.'}catch(e){}signedOut(m)};
 ({home,work,time,docs,dir,profile,team,chat,leads,progress})[view]();setBadge();
}
function home(){const u=me(),t=today(),last=S.att.find(x=>x.staff_id===u.id),a=last&&(last.day===t||!last.check_out)?last:null,mine=S.tasks.filter(x=>x.who===u.id&&x.s!=='done').length,h=new Date().getHours();
 $('#m').innerHTML=`<span class="eyebrow">${new Date().toDateString()}</span><h1>${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}, ${esc(u.name.split(' ')[0])}.</h1>

function cropDialog(file){return new Promise((res,rej)=>{
 const url=URL.createObjectURL(file),img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};
 img.onload=()=>{
  const V=Math.min(280,Math.floor(innerWidth*.72)),w=img.naturalWidth,h=img.naturalHeight,s0=Math.max(V/w,V/h);let z=1,x=0,y=0,done=false;
  const d=document.createElement('dialog');d.id='crd';
  d.innerHTML=`<form id="crf" style="display:grid;gap:14px;justify-items:center;width:min(340px,82vw)"><h3 style="font-size:26px;justify-self:start">Adjust photo</h3>
  <div id="crv" tabindex="0" aria-label="Photo preview. Drag or use arrow keys to reposition." style="position:relative;width:${V}px;height:${V}px;overflow:hidden;border-radius:12px;background:#000;touch-action:none;cursor:grab"><img id="cri" alt="" draggable="false" style="position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none"><div style="position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);outline:2px solid rgba(255,255,255,.85);outline-offset:-2px;pointer-events:none"></div></div>
  <label style="width:100%">Zoom<input id="crz" type="range" min="1" max="4" step="0.01" value="1"></label>
  <p class="note" style="margin:0">Drag to reposition. Use the slider to zoom.</p>
  <div style="display:flex;gap:10px;justify-self:end"><button type="button" class="btn sm ghost" id="crc">Cancel</button><button class="btn sm" type="submit">Save photo</button></div></form>`;
  document.body.appendChild(d);
  const I=d.querySelector('#cri'),box=d.querySelector('#crv'),Z=d.querySelector('#crz');I.src=url;
  const draw=()=>{const mx=Math.max(0,(w*s0*z-V)/2),my=Math.max(0,(h*s0*z-V)/2);x=Math.min(mx,Math.max(-mx,x));y=Math.min(my,Math.max(-my,y));
   const s=s0*z;I.style.width=w*s+'px';I.style.height=h*s+'px';I.style.transform=`translate(${V/2+x-w*s/2}px,${V/2+y-h*s/2}px)`};
  const zoom=nz=>{nz=Math.min(4,Math.max(1,nz));x*=nz/z;y*=nz/z;z=nz;Z.value=z;draw()};
  let px=null,py=null;
  box.onpointerdown=e=>{px=e.clientX;py=e.clientY;box.setPointerCapture(e.pointerId);box.style.cursor='grabbing'};
  box.onpointermove=e=>{if(px===null)return;x+=e.clientX-px;y+=e.clientY-py;px=e.clientX;py=e.clientY;draw()};
  box.onpointerup=box.onpointercancel=()=>{px=null;box.style.cursor='grab'};
  box.onwheel=e=>{e.preventDefault();zoom(z-e.deltaY*.002)};
  box.onkeydown=e=>{const k={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(k){e.preventDefault();x+=k[0];y+=k[1];draw()}};
  Z.oninput=()=>zoom(+Z.value);
  d.querySelector('#crc').onclick=()=>d.close();
  d.querySelector('#crf').onsubmit=e=>{e.preventDefault();const OUT=480,k=OUT/V,s=s0*z,c=document.createElement('canvas');c.width=c.height=OUT;
   const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,OUT,OUT);g.drawImage(img,(V/2+x-w*s/2)*k,(V/2+y-h*s/2)*k,w*s*k,h*s*k);
   let q=.85,u=c.toDataURL('image/jpeg',q);while(u.length>140000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}
   done=true;d.close();res(u)};
  d.addEventListener('close',()=>{URL.revokeObjectURL(url);d.remove();if(!done)rej(new Error('cancel'))});
  d.showModal();draw()};
 img.src=url})}

 paintList();paintShell();chatT=setInterval(()=>poll(),4000);if(CH.peer)poll(true);refreshSummary()}
function paintList(){const el=$('#clist');if(!el)return;const u=me();if(!u)return;const g=CH.sum.group||{unread:0},dm=Object.fromEntries(CH.sum.dms.map(d=>[d.peer,d]));
 const people=S.team.filter(t=>t.id!==u.id).sort((a,b)=>((dm[b.id]&&dm[b.id].last_at)||'').localeCompare((dm[a.id]&&dm[a.id].last_at)||'')||a.name.localeCompare(b.name));
 const row=(id,a,name,pv,at,un)=>`<button class="cr ${CH.peer===id?'on':''}" data-p="${id}" role="listitem">${a}<span class="ci"><span class="cn"><b>${esc(name)}</b><small>${at?fmt(at):''}</small></span><span class="cp"><span>${esc(pv)}</span>${un?`<span class="bdg">${un}</span>`:''}</span></span></button>`;
 const cut=x=>(x||'').length>38?x.slice(0,38)+'…':(x||'');
 el.innerHTML=row('group','<span class="av" style="background:var(--ink)">#</span>','Team chat',g.last_body?(g.last_sender===u.id?'You: ':nameOf(g.last_sender).split(' ')[0]+': ')+cut(g.last_body):'Everyone in the team',g.last_at,g.unread)
  +people.map(t=>{const d=dm[t.id];return row(t.id,av(t,null,true),t.name,d?(d.last_mine?'You: ':'')+cut(d.last_body):t.role,d&&d.last_at,d?d.unread:0)}).join('');
 el.querySelectorAll('.cr').forEach(b=>b.onclick=()=>{CH.peer=b.dataset.p;CH.msgs=[];CH.sig=null;chat()})}
function paintShell(){const el=$('#cthread');if(!el)return;
 if(!CH.peer){el.innerHTML='<div class="cempty"><p class="mut">Select a teammate to start chatting.</p></div>';return}
 const t=CH.peer==='group'?null:S.team.find(x=>x.id===CH.peer);
 el.innerHTML=`<div class="chd"><button class="ic cback" id="cb" aria-label="Back to chats">←</button>${t?av(t,40):'<span class="av" style="width:40px;height:40px;background:var(--ink)">#</span>'}<div><b>${t?esc(t.name):'Team chat'}</b><br><small class="mut">${t?esc(t.role):'Everyone in the team'}</small></div></div>
 <div class="cm" id="cmsgs" tabindex="0" aria-live="polite" aria-label="Messages"></div>
 <form class="cf" id="cform"><textarea id="ctx" rows="1" maxlength="1000" placeholder="Type a message" aria-label="Message"></textarea><button class="btn sm" type="submit" id="csend">Send</button></form>`;
 $('#cb').onclick=()=>{CH.peer=null;chat()};
 const tx=$('#ctx');tx.oninput=()=>{tx.style.height='auto';tx.style.height=Math.min(tx.scrollHeight,120)+'px'};
 tx.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#cform').requestSubmit()}};
 $('#cform').onsubmit=async e=>{e.preventDefault();const b=tx.value.trim(),bt=$('#csend');if(!b)return;bt.disabled=true;
  try{await call('chat_send',{p_peer:CH.peer==='group'?null:CH.peer,p_body:b});tx.value='';tx.style.height='';await poll(true);const m=$('#cmsgs');if(m)m.scrollTop=m.scrollHeight}
  catch(x){toast(friendly(x.message))}bt.disabled=false;tx.focus()};
 paintMsgs(true);tx.focus()}
function paintMsgs(stick){const el=$('#cmsgs');if(!el)return;const u=me(),near=el.scrollHeight-el.scrollTop-el.clientHeight<80;let last='';
 el.innerHTML=CH.msgs.map(m=>{const mine=m.sender===u.id,ds=new Date(m.created_at).toDateString(),
  sep=ds!==last?`<div class="cday"><span>${ds===new Date().toDateString()?'Today':new Date(m.created_at).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})}</span></div>`:'';last=ds;
  const who=!mine&&CH.peer==='group'?`<small class="cwho">${esc(nameOf(m.sender))}</small>`:'',
  tick=mine&&CH.peer!=='group'?(m.id<=CH.seen?'<span class="seen" title="Seen">✓✓</span>':'<span title="Sent">✓</span>'):'';
  return sep+`<div class="mrow ${mine?'me':''}"><div class="bub">${who}<span class="bt">${esc(m.body)}</span><span class="mm">${tm(m.created_at)} ${tick}${mine?`<button class="mdel" data-d="${m.id}" aria-label="Delete message">Delete</button>`:''}</span></div></div>`}).join('')||'<p class="mut cnone">No messages yet. Say hello 👋</p>';
 if(stick||near)el.scrollTop=el.scrollHeight;
 el.querySelectorAll('.mdel').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this message for everyone?'))return;try{await call('chat_delete',{p_id:+b.dataset.d});await poll(true)}catch(x){toast(friendly(x.message))}})}
async function poll(force){if(!S.user||!CH.peer||(document.hidden&&!force))return;const peer=CH.peer;
 try{const r=await call('chat_thread',{p_peer:peer==='group'?null:peer,p_sig:force?null:CH.sig});if(CH.peer!==peer||r.same)return;
  const lastOld=CH.msgs.length?CH.msgs[CH.msgs.length-1].id:0,lastNew=r.msgs.length?r.msgs[r.msgs.length-1].id:0;
  CH.msgs=r.msgs;CH.sig=r.sig;CH.seen=r.seen;paintMsgs(lastNew!==lastOld);refreshSummary()}
 catch(e){if(e.message==='not_signed_in')signedOut('Session expired. Please sign in again.')}}
const LSRC=['Instagram','WhatsApp','Referral','Cold call','Walk-in','Website','Other'],LST=['New','Contacted','Interested','Proposal sent','Converted','Lost'];
let LF={s:'all',q:''};
function leads(){
 $('#m').innerHTML=`<span class="eyebrow">Marketing</span><h1>Leads</h1><form class="f" id="lfm" style="margin-top:18px;grid-template-columns:minmax(180px,1fr) 180px auto"><label>Search<input id="lq" placeholder="Name, phone, notes" value="${esc(LF.q)}" autocomplete="off"></label><label>Status<select id="ls"><option value="all">All</option>${LST.map(x=>`<option ${LF.s===x?'selected':''}>${x}</option>`).join('')}</select></label><button type="button" class="btn sm" id="la">Add lead</button></form><div id="lbody"></div>`;
 $('#lfm').onsubmit=e=>e.preventDefault();$('#lq').oninput=e=>{LF.q=e.target.value;paintLeads()};$('#ls').onchange=e=>{LF.s=e.target.value;paintLeads()};$('#la').onclick=()=>leadDialog(null);paintLeads()}
function paintLeads(){const u=me(),el=$('#lbody');if(!el)return;const t=today(),all=S.leads,q=LF.q.trim().toLowerCase(),done=['Converted','Lost'];
 const rows=all.filter(l=>(LF.s==='all'||l.status===LF.s)&&(!q||[l.name,l.phone,l.email,l.notes,l.source].join(' ').toLowerCase().includes(q)));
 const conv=all.filter(l=>l.status==='Converted').length,rate=all.length?Math.round(conv/all.length*100):0,active=all.filter(l=>!done.includes(l.status)).length,due=all.filter(l=>l.follow_up&&l.follow_up<=t&&!done.includes(l.status)).length;
 el.innerHTML=`<div class="grid" style="margin-top:18px"><div class="card"><span class="mut">Total leads</span><div class="big">${all.length}</div></div><div class="card"><span class="mut">Active</span><div class="big">${active}</div></div><div class="card"><span class="mut">Follow-ups due</span><div class="big" style="${due?'color:var(--acc)':''}">${due}</div></div><div class="card"><span class="mut">Converted to clients</span><div class="big">${conv}<small class="mut" style="font:14px var(--b)"> · ${rate}%</small></div></div></div>
 <div class="scroll" style="margin-top:18px"><table><tr><th>Lead</th>${u.admin?'<th>Owner</th>':''}<th>Contact</th><th>Source</th><th>Status</th><th>Follow-up</th><th>Notes</th><th></th></tr>${rows.map(l=>{const od=l.follow_up&&l.follow_up<t&&!done.includes(l.status),n=l.notes||'';
  return `<tr><td><strong>${esc(l.name)}</strong></td>${u.admin?`<td>${esc(nameOf(l.owner))}</td>`:''}<td>${l.phone?`<a href="tel:${esc(l.phone.replace(/[^\d+]/g,''))}">${esc(l.phone)}</a>`:''}${l.phone&&l.email?'<br>':''}${l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:''}</td><td>${esc(l.source)}</td><td><select data-ls="${l.id}" aria-label="Status of ${esc(l.name)}">${LST.map(x=>`<option ${l.status===x?'selected':''}>${x}</option>`).join('')}</select></td><td${od?' style="color:var(--acc);font-weight:600"':''}>${l.follow_up||'—'}</td><td style="max-width:240px">${esc(n.slice(0,90))}${n.length>90?'…':''}</td><td style="white-space:nowrap"><button class="ic" data-le="${l.id}">Edit</button> <button class="ic" data-lx="${l.id}" aria-label="Delete lead ${esc(l.name)}">Delete</button></td></tr>`}).join('')||`<tr><td colspan="8" class="mut">${all.length?'No leads match.':'No leads yet. Click Add lead to start your list.'}</td></tr>`}</table></div>`;
 el.querySelectorAll('[data-ls]').forEach(x=>x.onchange=()=>act(()=>call('lead_status',{p_id:+x.dataset.ls,p_status:x.value})));
 el.querySelectorAll('[data-le]').forEach(b=>b.onclick=()=>leadDialog(S.leads.find(x=>String(x.id)===b.dataset.le)));
 el.querySelectorAll('[data-lx]').forEach(b=>b.onclick=()=>{const l=S.leads.find(x=>String(x.id)===b.dataset.lx);if(l&&confirm('Delete lead "'+l.name+'"?'))act(()=>call('lead_delete',{p_id:l.id}))})}
function leadDialog(l){const o=$('#ldd');if(o)o.remove();const d=document.createElement('dialog');d.id='ldd';const e=l||{};
 d.innerHTML=`<form id="ldf" style="display:grid;gap:12px;width:min(520px,84vw);max-height:78vh;overflow:auto;padding:2px"><h3 style="font-size:26px">${l?'Edit lead':'Add lead'}</h3>
 <label>Lead or business name<input id="ln" required maxlength="120" value="${esc(e.name||'')}"></label>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"><label>Phone<input id="lp" type="tel" maxlength="30" value="${esc(e.phone||'')}"></label><label>Email<input id="lm" type="email" maxlength="120" value="${esc(e.email||'')}"></label>
 <label>Source<select id="lsr">${LSRC.map(x=>`<option ${e.source===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status<select id="lst">${LST.map(x=>`<option ${(e.status||'New')===x?'selected':''}>${x}</option>`).join('')}</select></label>
 <label>Next follow-up<input id="lf3" type="date" value="${esc(e.follow_up||'')}"></label></div>
 <label>Notes<textarea id="lno" rows="4" maxlength="2000">${esc(e.notes||'')}</textarea></label>
 <p class="note" id="lerr" role="alert" style="color:var(--acc);margin:0;min-height:1.2em"></p>
 <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn sm ghost" id="lc">Cancel</button><button class="btn sm" type="submit" id="ls2">Save lead</button></div></form>`;
 document.body.appendChild(d);d.addEventListener('close',()=>d.remove());d.showModal();$('#ln').focus();
 $('#lc').onclick=()=>d.close();
 $('#ldf').onsubmit=async ev=>{ev.preventDefault();const n=$('#ln').value.trim();if(!n){$('#lerr').textContent='Enter a name.';return}
  $('#ls2').disabled=true;
  try{await call('lead_save',{p_id:l?l.id:null,p_name:n,p_phone:$('#lp').value.trim(),p_email:$('#lm').value.trim(),p_source:$('#lsr').value,p_status:$('#lst').value,p_follow:$('#lf3').value||null,p_notes:$('#lno').value.trim()});await pull();d.close();portal();toast('Lead saved')}
  catch(x){$('#lerr').textContent=friendly(x.message);$('#ls2').disabled=false}}}
function progress(){const emps=S.team.filter(t=>!t.admin),wk=Date.now()-7*864e5,t=today(),dn=['Converted','Lost'];
 const stats=id=>{const m=S.tasks.filter(x=>x.who===id),c=k=>m.filter(x=>x.s===k).length;return{n:m.length,todo:c('todo'),doing:c('doing'),done:c('done'),wk:m.filter(x=>x.s==='done'&&x.d&&new Date(x.d)>=wk).length}};
 const here=id=>{const a=S.att.find(x=>x.staff_id===id);return a&&(a.day===t||!a.check_out)?a:null};
 const open=S.tasks.filter(x=>x.s!=='done').length,week=S.tasks.filter(x=>x.s==='done'&&x.d&&new Date(x.d)>=wk).length,inn=emps.filter(e=>here(e.id)).length,unas=S.tasks.filter(x=>!x.who&&x.s!=='done').length;
 $('#m').innerHTML=`<span class="eyebrow">Founder</span><h1>Team progress</h1>
 <div class="grid"><div class="card"><span class="mut">Open tasks</span><div class="big">${open}</div>${unas?`<small class="mut">${unas} unassigned</small>`:''}</div><div class="card"><span class="mut">Done in the last 7 days</span><div class="big">${week}</div></div><div class="card"><span class="mut">Checked in today</span><div class="big">${inn}<small class="mut" style="font:14px var(--b)"> / ${emps.length}</small></div></div></div>
 <div class="grid" style="margin-top:20px">${emps.map(e=>{const s=stats(e.id),a=here(e.id),pc=n=>s.n?n/s.n*100:0,L=e.leads?S.leads.filter(l=>l.owner===e.id):[];
  return `<div class="card pcard"><div class="who" style="border:0;padding:0">${av(e,44)}<div style="flex:1"><strong>${esc(e.name)}</strong>${e.leads?' <span class="pill">Marketing</span>':''}<br><span class="mut">${esc(e.role)}</span></div></div>
  <p class="mut">${a?(a.check_out?'Checked out at '+tm(a.check_out):'Checked in at '+tm(a.check_in)):'Not checked in today'}</p>
  <div class="pbar" role="img" aria-label="${s.done} of ${s.n} tasks done" style="margin-top:12px"><i class="d" style="width:${pc(s.done)}%"></i><i class="p" style="width:${pc(s.doing)}%"></i></div>
  <p>${s.n?`${s.done} done · ${s.doing} in progress · ${s.todo} to do`:'No tasks assigned yet'}</p><p class="mut">Finished in the last 7 days: <strong>${s.wk}</strong></p>
  ${e.leads?`<p class="mut">Leads: ${L.length} · ${L.filter(l=>l.status==='Converted').length} converted · ${L.filter(l=>l.follow_up&&l.follow_up<=t&&!dn.includes(l.status)).length} follow-ups due</p>`:''}
  <button class="btn sm ghost" style="margin-top:14px" data-pv="${e.id}">View work</button></div>`}).join('')||'<p class="mut">No employees yet. Add them in the Team tab.</p>'}</div>`;
 document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>workDialog(S.team.find(x=>x.id===b.dataset.pv)))}
function workDialog(e){if(!e)return;const o=$('#wkd');if(o)o.remove();const d=document.createElement('dialog');d.id='wkd';
 const m=S.tasks.filter(x=>x.who===e.id),by=k=>m.filter(x=>x.s===k),A=S.att.filter(x=>x.staff_id===e.id).slice(0,7),L=S.leads.filter(l=>l.owner===e.id),
 dd=i=>new Date(i).toLocaleDateString([],{day:'numeric',month:'short'}),
 list=(arr,ex)=>arr.length?`<ul style="margin:6px 0 0;padding-left:18px">${arr.map(x=>`<li>${esc(x.t)} <small class="mut">· ${esc(x.p)}${ex?ex(x):''}</small></li>`).join('')}</ul>`:'<p class="mut" style="margin:6px 0 0">Nothing here.</p>',
 done=by('done').sort((a,b)=>(b.d||'').localeCompare(a.d||'')).slice(0,8),
 act2=L.filter(l=>!['Converted','Lost'].includes(l.status)).sort((a,b)=>(a.follow_up||'9999').localeCompare(b.follow_up||'9999')).slice(0,6);
 d.innerHTML=`<div style="width:min(640px,88vw);max-height:78vh;overflow:auto;padding:2px"><div class="who" style="border:0;padding:0 0 4px">${av(e,48)}<div style="flex:1"><h3 style="font-size:26px">${esc(e.name)}</h3><span class="mut">${esc(e.role)}</span></div><button class="ic" id="wkx" aria-label="Close">✕</button></div>
 <h3 class="sh">In progress (${by('doing').length})</h3>${list(by('doing'))}
 <h3 class="sh">To do (${by('todo').length})</h3>${list(by('todo'))}
 <h3 class="sh">Recently done</h3>${list(done,x=>x.d?' · done '+dd(x.d):'')}
 ${e.leads?`<h3 class="sh">Leads (${L.length} total · ${L.filter(l=>l.status==='Converted').length} converted)</h3>${act2.length?`<ul style="margin:6px 0 0;padding-left:18px">${act2.map(l=>`<li>${esc(l.name)} <small class="mut">· ${esc(l.status)}${l.follow_up?' · follow up '+dd(l.follow_up):''}</small></li>`).join('')}</ul>`:'<p class="mut" style="margin:6px 0 0">No active leads.</p>'}`:''}
 <h3 class="sh">Attendance (last 7 records)</h3><div class="scroll"><table><tr><th>Date</th><th>In</th><th>Out</th></tr>${A.map(a=>`<tr><td>${a.day}</td><td>${tm(a.check_in)}</td><td>${a.check_out?tm(a.check_out):'—'}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">No attendance yet.</td></tr>'}</table></div>
 <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn sm ghost" id="wkm">Message</button><button class="btn sm" id="wkc">Close</button></div></div>`;
 document.body.appendChild(d);d.addEventListener('close',()=>d.remove());d.showModal();
 $('#wkx').onclick=$('#wkc').onclick=()=>d.close();
 $('#wkm').onclick=()=>{CH.peer=e.id;CH.msgs=[];CH.sig=null;d.close();view='chat';portal()}}
(async function boot(){
 $('#app').innerHTML='<div class="login"><p class="mut">Loading…</p></div>';
 if(TOK){try{await pull();if(me()){portal();startBadge();return}}catch(e){TOK=null;try{localStorage.removeItem(TOK_KEY)}catch(x){}}}
 login()})();
</script>
